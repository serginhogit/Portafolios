<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portafolio personal">
    <title>Sergio Pradeda Gajardo</title>
    <link rel="icon" type="image/svg+xml" href="res/img/kotlin.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            background-color: #333;
            color: #fff;
            display: flex;
        }
        nav{
            background-color: #444;
            width: 200px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            >span{
                font-size: 24px;
                font-weight: bold;
            }
            >section{
                margin-top: 20px;
                cursor: pointer;
                &:hover{
                    text-decoration: underline;
                }
            }
        }


    </style>
</head>
<body>
    <nav>
        <span>Navegacion</span>
        <section>Inicio</section>
        <section>Proyectos</section>
        <section>Contacto</section>
    </nav>
    <main>Buenas, bienvenido a mi portafolio</main>
    <footer>pie de pagina</footer>
</body>
</html>
